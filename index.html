<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="קביעת תורים, מחירון, גלריה ודרכי הגעה למספרה" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./barbers-logo.png" />
    <link rel="apple-touch-icon" href="./barbers-logo.png" />
    <title>BARBERS</title>
    <script>(function(){var t;try{t=localStorage.getItem("barbera-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;var c=t==="dark"?"#000000":"#f6f3ee";document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute("content",c)})})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/pages-entry.tsx"></script>
  </body>
</html>
